<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BhrashtacharMukt-Bharat | Viksit Bharat @2047</title>
<style>
  :root {
    --saffron: #FF9933;
    --green: #138808;
    --blue: #000080;
    --white: #FFFFFF;
  }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #f4f4f4; }
  
  /* HEADER */
  header {
    background: linear-gradient(90deg, var(--saffron), var(--white), var(--green));
    color: var(--blue);
    padding: 15px;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }
  header h1 { font-size: 22px; }
  header p { font-size: 12px; }

  /* CONTAINER */
  .container { max-width: 600px; margin: 20px auto; padding: 15px; }
  
  /* FORM CARD */
  .card {
    background: var(--white);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    margin-bottom: 20px;
    border-top: 5px solid var(--saffron);
  }
  .card h2 { color: var(--blue); margin-bottom: 15px; font-size: 18px; }
  
  input, select, textarea, button {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
  }
  button {
    background: var(--green);
    color: var(--white);
    border: none;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover { background: #0f6a06; }
  
  /* COMPLAINT LIST */
  .complaint {
    background: var(--white);
    padding: 15px;
    border-radius: 10px;
    margin: 10px 0;
    border-left: 5px solid var(--saffron);
  }
  .complaint .id { font-weight: bold; color: var(--blue); }
  .complaint .status { 
    float: right; 
    padding: 3px 8px; 
    border-radius: 5px; 
    font-size: 12px;
    background: #ffcc00; 
  }
  .status.solved { background: var(--green); color: white; }
  
  footer { text-align: center; padding: 20px; font-size: 12px; color: #555; }
</style>
</head>
<body>

<header>
  <h1>🇮🇳 BhrashtacharMukt-Bharat</h1>
  <p>Viksit Bharat @2047 ka Sankalp - Zero Corruption</p>
</header>

<div class="container">

  <!-- 1. REPORT FORM -->
  <div class="card">
    <h2>1. Anonymous Complaint Karein</h2>
    <form id="complaintForm">
      <select id="vibhag" required>
        <option value="">-- Vibhag Chune --</option>
        <option>Police</option>
        <option>Hospital</option>
        <option>School/College</option>
        <option>Ration/Dukan</option>
        <option>Nagar Palika</option>
        <option>Other</option>
      </select>
      <textarea id="details" rows="4" placeholder="Kya hua? Pura detail likhein..." required></textarea>
      <input type="text" id="location" placeholder="Location: Gaon, Jila, Rajya" required>
      <input type="file" id="photo" accept="image/*">
      <button type="submit">Complaint Submit Karein</button>
    </form>
    <p id="successMsg" style="color:green; display:none;">✅ Complaint Submit ho gayi! Tracking ID: <b id="trackId"></b></p>
  </div>

  <!-- 2. TRACK COMPLAINT -->
  <div class="card">
    <h2>2. Complaint Track Karein</h2>
    <input type="text" id="trackInput" placeholder="Apna Tracking ID daalein">
    <button onclick="trackComplaint()">Track</button>
    <p id="trackResult"></p>
  </div>

  <!-- 3. PUBLIC WALL -->
  <div class="card">
    <h2>3. Public Wall - Sabki Nazar</h2>
    <div id="complaintList">
      <!-- Yahan complaint ayengi -->
    </div>
  </div>

</div>

<footer>
  Jai Hind | Made for Viksit Bharat @2047 by Chandan Kumar, Jamalpur, Bihar
</footer>

<script>
  // Local Storage me data save hoga
  let complaints = JSON.parse(localStorage.getItem('complaints')) || [];

  // Page load pe list dikhao
  window.onload = showComplaints;

  // 1. FORM SUBMIT
  document.getElementById('complaintForm').addEventListener('submit', function(e){
    e.preventDefault();
    let id = 'BM' + Date.now(); // Unique ID
    let newComplaint = {
      id: id,
      vibhag: document.getElementById('vibhag').value,
      details: document.getElementById('details').value,
      location: document.getElementById('location').value,
      status: 'Pending',
      date: new Date().toLocaleDateString('hi-IN')
    };
    complaints.push(newComplaint);
    localStorage.setItem('complaints', JSON.stringify(complaints));
    
    document.getElementById('trackId').innerText = id;
    document.getElementById('successMsg').style.display = 'block';
    this.reset();
    showComplaints();
  });

  // 2. SHOW ALL COMPLAINTS
  function showComplaints(){
    let list = document.getElementById('complaintList');
    list.innerHTML = '';
    if(complaints.length == 0){
      list.innerHTML = '<p>Abhi tak koi complaint nahi hai.</p>';
      return;
    }
    complaints.reverse().forEach(c => {
      list.innerHTML += `
        <div class="complaint">
          <span class="status ${c.status == 'Solved' ? 'solved' : ''}">${c.status}</span>
          <p class="id">ID: ${c.id}</p>
          <p><b>Vibhag:</b> ${c.vibhag}</p>
          <p><b>Location:</b> ${c.location}</p>
          <p><b>Detail:</b> ${c.details}</p>
          <p><small>Date: ${c.date}</small></p>
        </div>
      `;
    });
  }

  // 3. TRACK FUNCTION
  function trackComplaint(){
    let trackId = document.getElementById('trackInput').value;
    let found = complaints.find(c => c.id == trackId);
    let result = document.getElementById('trackResult');
    if(found){
      result.innerHTML = `<b>Status:</b> ${found.status} <br> <b>Vibhag:</b> ${found.vibhag}`;
    } else {
      result.innerHTML = `<b style="color:red;">Galat ID hai</b>`;
    }
  }

</script>
</body>
</html>
